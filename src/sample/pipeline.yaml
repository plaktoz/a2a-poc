# The four stages of src/sample/pipeline.py. Each stage is its own A2A agent
# (src/sample/stage_agents.py) that wraps one LLM worker and model.
#
# - worker: a key under `workers:` in llm.yaml; it must be enabled there. Its harness
#   (codex or claude-agent-sdk) decides how the agent calls its LLM.
# - model:  optional. It must be allowed for that worker in llm.yaml (both
#   `workers.<name>.models` and `llm.allowed_models`). Default: the worker's default_model.
# - url:    where the stage's agent serves A2A, http://host:port, one per stage.
#   pipeline.py starts the agent there, unless --no-launch, in which case the agent
#   must already be running (`uv run python src/sample/stage_agents.py <stage>`).
stages:
  requirements:                  # asks questions, drafts the spec, waits for your acceptance
    worker: claude-agent-sdk
    # model: defaults to ANTHROPIC_MODEL
    url: http://127.0.0.1:9101

  tests:                         # writes the acceptance tests
    worker: codex-gpt
    # model: gpt-6.1-sol
    url: http://127.0.0.1:9102

  implement:                     # builds the app
    worker: codex-gpt
    # model: gpt-6.1-sol
    url: http://127.0.0.1:9103

  verify:                        # runs the tests and checks each criterion
    worker: codex-gemini
    # model: gemini-3.6-flash
    url: http://127.0.0.1:9104
