# How the factory works with templates/bullmq-worker/ (see src/factory/scaffold.py).
surface: worker
summary: the background worker that takes jobs from a BullMQ queue (Redis), tested without Redis
start: npm start
suite: vitest
serve: null
commands:
  test: npx vitest run
  lint: npx tsc --noEmit
test_files: ["tests/*.test.ts"]
source_files: ["src/*"]
protected: [package.json, package-lock.json, tsconfig.json, src/worker.ts]
stack: |
  - Node + BullMQ + TypeScript (strict, ES modules). Import local files with a .js ending:
    `import { x } from './x.js'`.
  - The job logic lives in handlers: src/handlers.ts exports `handlers`, a record from job name to
    an async function that takes the job data and returns its result, and handle(name, data).
    src/worker.ts (fixed) runs a BullMQ Worker on the REDIS_URL queue and calls handle() for each
    job. A handler throws to fail the job; BullMQ then retries it.
  - Handlers must be safe to run twice with the same data (a retry): derive results from the data,
    and write results with an upsert, not an insert.
  - Handlers never import bullmq or open a Redis connection. Anything outside the process (files,
    the database, other services) comes in through a parameter or a small module that tests can
    replace, so tests need no Redis and no network.
  - Tests: Vitest in tests/*.test.ts, in the Node environment. Call handle() or a handler directly.
    Name every test with its criterion id and a colon: it('AC3: ...').
  - No new dependencies: package.json is fixed. `npx tsc --noEmit` must pass.
  - Layout: one file per kind of job under src/jobs/, registered in src/handlers.ts.
