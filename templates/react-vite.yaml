# How the factory works with templates/react-vite/ (see src/factory/scaffold.py).
surface: frontend
summary: the React UI in the browser, tested with React Testing Library in jsdom
start: npm run dev
api_prefix: /api/
suite: vitest
serve: vite
commands:
  test: npx vitest run
  build: npm run build
test_files: ["src/*.test.jsx"]
source_files: ["src/*"]
protected: [package.json, package-lock.json, vite.config.js, index.html, src/main.jsx, src/setupTests.js]
stack: |
  - React 19 + Vite, plain JavaScript with JSX (no TypeScript).
  - src/main.jsx renders the default export of src/App.jsx and imports src/App.css.
  - Tests: Vitest + jsdom + @testing-library/react + @testing-library/user-event, with jest-dom
    matchers. src/setupTests.js clears localStorage before each test and cleans up after it.
  - Name every test with its criterion id and a colon: it('AC3: ...').
  - No new dependencies: package.json is fixed.
  - Layout: App.jsx only composes; one component per file under src/components/; state in a custom
    hook under src/hooks/; semantic, labelled, keyboard-friendly controls; all styles in
    src/App.css using CSS custom properties.
  - Drag and drop must not be the only way to do something: give every drag action a keyboard
    or button alternative.
  - If the app has no other surface, keep state in the browser (localStorage) when it must persist.
  - With a backend: vite.config.js proxies /api to the backend on 127.0.0.1:8000, so call it with
    fetch and relative URLs. Tests must not need a server: mock fetch with
    vi.spyOn(globalThis, 'fetch') returning responses that follow the API contract, and wait for
    the UI with findBy queries.
