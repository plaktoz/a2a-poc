# Audit code that already exists. Nothing is changed.
#
# One auditor per lens reads the target in parallel. Each finding is kept only if its evidence
# really is in the cited file near the cited line, so the report has no invented problems.
name: code-audit
title: Code audit
description: >
  Reviews an existing codebase through several lenses in parallel (security, correctness,
  maintainability, tests), checks every finding against the code, and writes a prioritized report.
use_when: >
  The request asks to review, audit or assess existing code, or to find its bugs, risks or
  technical debt, without changing it.
needs_target: true
inputs:
  lenses:
    description: "the lenses to audit through, comma-separated; one auditor for each"
    type: list
    default: [security, correctness, maintainability, tests]
  lens_guidance:
    description: "what each lens looks for; name every lens in --input lenses"
    default: |
      - security: injection, unsafe input handling, secrets in code, authn/authz gaps, unsafe
        dependencies or defaults.
      - correctness: logic errors, unhandled errors and edge cases, races, wrong assumptions.
      - maintainability: duplication, unclear structure or names, dead code, oversized modules.
      - tests: important behaviour without tests, weak or brittle assertions, skipped tests.
  max_findings:
    description: "the most findings one lens may report"
    type: number
    default: 10
  ignore_paths:
    description: "folders and files the audit skips"
    default: "node_modules, .venv, dist and other generated files"
steps:
  - id: audit
    role: auditor
    for_each: inputs.lenses
    parallel: true
    cwd: target
    instructions: |
      Audit this codebase through the {{ item.name }} lens. The user's request:
      {{ brief }}

      Lens guidance:
      {{ inputs.lens_guidance }}
      Report at most {{ inputs.max_findings }} findings, most severe first. Paths are relative to
      the current directory. Skip {{ inputs.ignore_paths }}.
    output: audit_findings
    gates: [evidence_verified]

  - loop: write
    rounds: budget
    steps:
      - id: report
        role: writer
        reads: [audit]
        instructions: |
          Write the audit report for {{ target }}, from the verified findings only. Open with a
          summary and the three things to fix first, then a section per severity (critical,
          high, medium, low), each finding with its file:line, why it matters and the fix.
          Merge findings that different lenses report for the same code.
        output: report
        save: AUDIT.md

      - id: review
        role: reviewer
        reads: [audit, report]
        instructions: |
          Review the audit report against the verified findings: is every finding in it, is
          the prioritization sound, is each recommendation concrete and correct?

          The writer works only from the verified findings and cannot inspect the code or run
          anything further. Judge the report against those findings. Ask for changes only to what
          the writer can fix from them: a finding that is missing, misstated or wrongly
          prioritized, or a recommendation that contradicts its finding. Do not ask for
          evidence or checks beyond the findings; where a recommendation depends on something
          unverified, it is enough that the report says so.
        output: verdict
        gates: [review_approves]

finish:
  - text: "The audit is {{ workspace }}/AUDIT.md"
